[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "equivariant-pde-find"
version = "0.1.0"
authors = [{ name = "Ballerin & Grong" }]
description = "Equivariant PDE discovery with O(2)-equivariant multigraph operators"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.20",
]

[project.optional-dependencies]
test = [
    "pytest>=7.0",
    # Test-only: independent CAS oracle for the jet decompositions
    # (tests/test_jet_algebra_cas.py).  Nothing under src/ imports sympy.
    "sympy>=1.9",
]
notebooks = [
    "matplotlib",
    "scipy",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: tests that require the scripts/ directory (e.g. sweep.py)",
    "slow: tests that take more than a few seconds",
]
pythonpath = ["scripts"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
